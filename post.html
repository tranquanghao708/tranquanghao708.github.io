<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải… | Trần Quang Hào</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">

    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-dark.min.css">
    <!-- Highlight.js (tô màu code) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">

    <style>
        :root {
            --bg: #0d1117;
            --bg-elevated: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --text-dim: #6e7681;
            --accent: #58a6ff;
            --green: #3fb950;
            --font-mono: "SFMono-Regular", "Cascadia Code", "Fira Code", Consolas, Menlo, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 860px; margin: 0 auto; padding: 0 1.25rem 4rem; }

        /* Nav */
        .top-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(13,17,23,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            margin: 0 -1.25rem 1.8rem;
            padding: 0 1.25rem;
        }
        .nav {
            display: flex; align-items: center; justify-content: space-between;
            height: 52px; max-width: 860px; margin: 0 auto;
        }
        .logo {
            font-family: var(--font-mono); font-size: 0.9rem; font-weight: 600;
            color: var(--text); text-decoration: none;
        }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 1.3rem; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; }
        .nav-links a:hover { color: var(--accent); }

        /* Loading / Error */
        .status {
            text-align: center; padding: 4rem 1rem;
            color: var(--text-dim); font-family: var(--font-mono);
        }
        .status.error { color: #f85149; }

        /* Markdown body */
        .markdown-body {
            background: transparent !important;
            font-size: 16px;
            line-height: 1.7;
        }
        .markdown-body h1 { border-bottom: 1px solid var(--border); padding-bottom: 0.4em; }
        .markdown-body pre { background: #0a0e14 !important; border: 1px solid var(--border); }

        /* ===== GitHub-style Alerts (NOTE, TIP, WARNING...) ===== */
        /* ===== GitHub-style Alerts ===== */
.markdown-alert {
    padding: 0.85rem 1rem;
    margin: 1.25rem 0;
    border-left: 0.25em solid;
    border-radius: 0 6px 6px 0;
    background: #161b22;
}
.markdown-alert > :first-child { margin-top: 0; }
.markdown-alert > :last-child  { margin-bottom: 0; }

.markdown-alert-title {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.4rem;
    line-height: 1;
}
.markdown-alert-title svg {
    width: 16px; height: 16px; fill: currentColor; flex-shrink: 0;
}

.markdown-alert-note      { border-color: #1f6feb; }
.markdown-alert-note .markdown-alert-title { color: #58a6ff; }

.markdown-alert-tip       { border-color: #238636; }
.markdown-alert-tip .markdown-alert-title { color: #3fb950; }

.markdown-alert-important { border-color: #8957e5; }
.markdown-alert-important .markdown-alert-title { color: #a371f7; }

.markdown-alert-warning   { border-color: #9e6a03; }
.markdown-alert-warning .markdown-alert-title { color: #d29922; }

.markdown-alert-caution   { border-color: #da3633; }
.markdown-alert-caution .markdown-alert-title { color: #f85149; }

/* Bảng */
.markdown-body table {
    border-spacing: 0;
    border-collapse: collapse;
    display: block;
    width: max-content;
    max-width: 100%;
    overflow: auto;
    margin: 1.2rem 0;
}
.markdown-body table th,
.markdown-body table td {
    padding: 6px 13px;
    border: 1px solid #30363d;
}
.markdown-body table tr { background: #0d1117; border-top: 1px solid #21262d; }
.markdown-body table tr:nth-child(2n) { background: #161b22; }
.markdown-body table th { font-weight: 600; background: #161b22; }

/* details / summary */
.markdown-body details {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 0.6rem 1rem;
    margin: 1rem 0;
}
.markdown-body details summary {
    cursor: pointer;
    font-weight: 600;
    color: #e6edf3;
}
.markdown-body details[open] summary { margin-bottom: 0.6rem; }

/* kbd */
.markdown-body kbd {
    background: #161b22;
    border: 1px solid #30363d;
    border-bottom-color: #21262d;
    border-radius: 6px;
    box-shadow: inset 0 -1px 0 #21262d;
    color: #e6edf3;
    font-family: var(--font-mono);
    font-size: 0.85em;
    padding: 0.15em 0.4em;
}

/* hr */
.markdown-body hr {
    height: 0.15em;
    background: #21262d;
    border: 0;
    margin: 2rem 0;
}

/* Nested list indentation rõ hơn */
.markdown-body ul ul,
.markdown-body ol ol,
.markdown-body ul ol,
.markdown-body ol ul {
    margin-top: 0.3em;
    margin-bottom: 0.3em;
}

        /* Meta + Engagement (giữ lại từ bản trước) */
        .post-meta {
            font-family: var(--font-mono); font-size: 0.82rem;
            color: var(--text-dim); margin-bottom: 1.5rem;
        }

        .engagement {
            margin: 2.8rem 0 1.5rem;
            padding: 1.2rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .views {
            font-family: var(--font-mono); font-size: 0.85rem;
            color: var(--text-dim); margin-bottom: 1rem;
        }
        .reactions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .reaction-btn {
            display: inline-flex; align-items: center; gap: 0.35rem;
            background: #1c2128; border: 1px solid var(--border);
            border-radius: 999px; padding: 0.35rem 0.75rem;
            font-size: 0.88rem; color: var(--text-muted);
            cursor: pointer; transition: all 0.15s; user-select: none;
        }
        .reaction-btn:hover { border-color: var(--accent); color: var(--text); }
        .reaction-btn.active {
            border-color: var(--accent); background: #388bfd22; color: var(--accent);
        }

        /* Comments */
        .comments-section { margin-top: 2.5rem; }
        .comments-section h2 {
            font-size: 1.15rem; color: #fff; margin-bottom: 1.2rem;
        }
        .comments-section h2 span {
            font-family: var(--font-mono); font-size: 0.85rem;
            color: var(--text-dim); font-weight: 400;
        }
        .comment-form {
            background: #1c2128; border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.15rem; margin-bottom: 1.8rem;
        }
        .comment-form textarea {
            width: 100%; min-height: 90px; resize: vertical;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 0.75rem 0.9rem;
            color: var(--text); font-size: 0.95rem; margin-bottom: 0.8rem; outline: none;
        }
        .comment-form textarea:focus { border-color: var(--accent); }
        .form-row { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }
        .comment-form input[type="text"] {
            flex: 1; min-width: 140px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 0.5rem 0.8rem;
            color: var(--text); font-size: 0.9rem; outline: none;
        }
        .submit-btn {
            background: var(--accent); color: #0d1117; border: none;
            border-radius: 6px; padding: 0.5rem 1.1rem;
            font-family: var(--font-mono); font-size: 0.88rem; font-weight: 600;
            cursor: pointer;
        }
        .comment-list { display: grid; gap: 1rem; }
        .comment {
            background: #161b22; border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem 1.15rem;
        }
        .comment-header {
            display: flex; justify-content: space-between; margin-bottom: 0.4rem;
            flex-wrap: wrap; gap: 0.4rem;
        }
        .comment-author { font-family: var(--font-mono); font-size: 0.88rem; color: var(--accent); }
        .comment-time { font-size: 0.78rem; color: var(--text-dim); }
        .comment-body { font-size: 0.95rem; color: var(--text-muted); white-space: pre-wrap; }
        .no-comments {
            text-align: center; padding: 2rem; color: var(--text-dim);
            border: 1px dashed var(--border); border-radius: var(--radius);
        }

        .back-link {
            display: inline-block; margin-top: 2.5rem;
            font-family: var(--font-mono); font-size: 0.88rem;
            color: var(--accent); text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        footer {
            margin-top: 3rem; padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.84rem; color: var(--text-dim);
        }
    </style>
</head>

<div class="container">
    <div class="top-bar">
        <nav class="nav">
            <a href="index.html" class="logo"><span>~/</span>tranquanghao</a>

                <li><a href="index.html">Trang chủ</a></li>

    <div id="status" class="status">Đang tải bài viết…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<script>
(function () {
    // ========== GitHub-like heading slug (hỗ trợ tiếng Việt) ==========
    function githubSlug(text) {
        return text
            .toString()
            .trim()
            .toLowerCase()
            .normalize('NFD')                   // tách dấu
            .replace(/[\u0300-\u036f]/g, '')    // bỏ dấu
            .replace(/đ/g, 'd')
            .replace(/[^a-z0-9\s-]/g, '')      // chỉ giữ chữ số, khoảng trắng, -
            .replace(/\s+/g, '-')               // space → -
            .replace(/-+/g, '-')                // gộp nhiều -
            .replace(/^-|-$/g, '');
    }

    // ========== Icons cho alerts (SVG giống GitHub) ==========
    const ALERT_ICONS = {
        note: `<svg viewBox="0 0 16 16"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>`,
        tip: `<svg viewBox="0 0 16 16"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.10.10.0.2.192.168.1.4.36.67.576 1.022.24.393.425.747.425 1.171v1a.75.75 0 0 0 1.5 0v-1c0-.616-.262-1.14-.524-1.57a5.65 5.65 0 0 0-.597-1.048 8.861 8.861 0 0 0-.46-.558l-.214-.253C5.924 6.125 5.5 5.734 5.5 5.25 5.5 3.81 6.637 2.999 8 3c1.363 0 2.5.81 2.5 2.25 0 .484-.424.875-.984 1.496l-.214.253c-.145.172-.29.365-.46.558a5.65 5.65 0 0 0-.597 1.048c-.262.43-.524.954-.524 1.57v1a.75.75 0 0 0 1.5 0v-1c0-.424.185-.778.425-1.171a8.15 8.15 0 0 1 .576-1.022c.16-.246.32-.49.46-.732.145-.242.29-.485.46-.732l.214-.253C11.576 6.125 12 5.734 12 5.25c0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"/></svg>`,
        important: `<svg viewBox="0 0 16 16"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .172.16.0.3.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>`,
        warning: `<svg viewBox="0 0 16 16"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>`,
        caution: `<svg viewBox="0 0 16 16"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>`
    };

    const ALERT_TITLES = {
        note: 'Note',
        tip: 'Tip',
        important: 'Important',
        warning: 'Warning',
        caution: 'Caution'
    };

    // ========== Pre-process alerts (xử lý tốt nội dung nhiều dòng) ==========
    function preprocessAlerts(md) {
        // Khớp > [!TYPE] rồi các dòng tiếp theo bắt đầu bằng >
        return md.replace(
            /^> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*\n((?:^>.*\n?)*)/gmi,
            (match, type, body) => {
                type = type.toLowerCase();
                // Bỏ dấu > ở đầu mỗi dòng
                const cleaned = body.replace(/^>[ \t]?/gm, '').trimEnd();
                // Render phần thân bằng marked (để hỗ trợ list, code, link bên trong alert)
                const bodyHtml = marked.parse(cleaned, { async: false });
                return `\n\n<div class="markdown-alert markdown-alert-${type}" data-alert="${type}">
<p class="markdown-alert-title">${ALERT_ICONS[type] || ''} ${ALERT_TITLES[type]}</p>
${bodyHtml}
</div>\n\n`;
            }
        );
    }

    // ========== Cấu hình marked ==========
    const renderer = new marked.Renderer();

    // Heading có id giống GitHub → anchor link hoạt động
    renderer.heading = function ({ text, depth }) {
        const plain = text.replace(/<[^>]+>/g, ''); // bỏ thẻ html nếu có
        const id = githubSlug(plain);
        return `<h${depth} id="${id}">${text}</h${depth}>\n`;
    };

    marked.setOptions({
        renderer,
        gfm: true,
        breaks: false,          // giống GitHub hơn (cần 2 space hoặc empty line)
        pedantic: false,
        highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                try {
                    return hljs.highlight(code, { language: lang }).value;
                } catch (e) {}
            }
            return hljs.highlightAuto(code).value;
        }
    });

    // ========== Load bài viết ==========
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const url  = params.get('url');
    const POST_ID = file || url || 'unknown';

    const statusEl  = document.getElementById('status');
    const articleEl = document.getElementById('article');
    const contentEl = document.getElementById('content');

    async function loadMarkdown() {
        let mdText = '';
        let sourceLabel = '';

        try {
            if (url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Không tải được file từ URL');
                mdText = await res.text();
                sourceLabel = 'Nguồn ngoài';
            } else if (file) {
                const res = await fetch(`posts/${file}`);
                if (!res.ok) throw new Error(`Không tìm thấy posts/${file}`);
                mdText = await res.text();
                sourceLabel = file;
            } else {
                throw new Error('Thiếu tham số ?file=... hoặc ?url=...');
            }

            // 1. Xử lý alerts trước
            let processed = preprocessAlerts(mdText);

            // 2. Parse Markdown
            let html = marked.parse(processed);

            contentEl.innerHTML = html;

            // 3. Highlight code
            contentEl.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });

            // 4. Meta + hiện UI
            document.getElementById('post-meta').textContent = `Nguồn: ${sourceLabel} · đang học`;
            statusEl.style.display = 'none';
            articleEl.style.display = 'block';
            document.getElementById('engagement').style.display = 'block';
            document.getElementById('comments-section').style.display = 'block';
            document.getElementById('back-link').style.display = 'inline-block';
            document.getElementById('footer').style.display = 'block';

            // Title
            const h1 = contentEl.querySelector('h1');
            document.title = (h1 ? h1.textContent : 'Bài viết') + ' | Trần Quang Hào';

            // Scroll tới anchor nếu có hash
            if (location.hash) {
                const target = document.querySelector(location.hash);
                if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 100);
            }

            initEngagement();
            initComments();

        } catch (err) {
            statusEl.className = 'status error';
            statusEl.textContent = 'Lỗi: ' + err.message;
            console.error(err);
        }
    }

    // ========== Views + Reactions + Comments (giữ nguyên) ==========
    function initEngagement() {
        const viewKey = `views_${POST_ID}`;
        let views = parseInt(localStorage.getItem(viewKey) || '0', 10) + 1;
        localStorage.setItem(viewKey, views);
        document.querySelector('#view-count span').textContent = views;

        const reactKey = `react_${POST_ID}`;
        const reactedKey = `reacted_${POST_ID}`;
        let reactions = JSON.parse(localStorage.getItem(reactKey) || '{"like":0,"clap":0,"wow":0,"think":0,"angry":0}');
        let myReaction = localStorage.getItem(reactedKey) || null;

        function renderReactions() {
            document.querySelectorAll('.reaction-btn').forEach(btn => {
                const type = btn.dataset.type;
                btn.querySelector('.count').textContent = reactions[type] || 0;
                btn.classList.toggle('active', myReaction === type);
            });
        }
        renderReactions();

        document.getElementById('reactions').addEventListener('click', e => {
            const btn = e.target.closest('.reaction-btn');
            if (!btn) return;
            const type = btn.dataset.type;
            if (myReaction === type) {
                reactions[type] = Math.max(0, (reactions[type] || 0) - 1);
                myReaction = null;
                localStorage.removeItem(reactedKey);
            } else {
                if (myReaction) reactions[myReaction] = Math.max(0, (reactions[myReaction] || 0) - 1);
                reactions[type] = (reactions[type] || 0) + 1;
                myReaction = type;
                localStorage.setItem(reactedKey, type);
            }
            localStorage.setItem(reactKey, JSON.stringify(reactions));
            renderReactions();
        });
    }

    function initComments() {
        const commentKey = `comments_${POST_ID}`;
        let comments = JSON.parse(localStorage.getItem(commentKey) || '[]');

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            const noCmt = document.getElementById('no-comments');
            document.getElementById('comment-count').textContent = `(${comments.length})`;
            if (comments.length === 0) {
                list.innerHTML = '';
                list.appendChild(noCmt);
                noCmt.style.display = 'block';
                return;
            }
            noCmt.style.display = 'none';
            list.innerHTML = comments.map(c => `
                <div class="comment">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(c.name || 'Ẩn danh')}</span>
                        <span class="comment-time">${c.time}</span>
                    </div>
                    <div class="comment-body">${escapeHtml(c.text)}</div>
                </div>
            `).join('');
        }

        document.getElementById('submit-comment').addEventListener('click', () => {
            const text = document.getElementById('comment-text').value.trim();
            const name = document.getElementById('comment-name').value.trim();
            if (!text) return alert('Bạn chưa nhập nội dung.');
            const timeStr = new Date().toLocaleString('vi-VN', {
                day:'2-digit', month:'2-digit', year:'numeric',
                hour:'2-digit', minute:'2-digit'
            });
            comments.unshift({ name, text, time: timeStr });
            localStorage.setItem(commentKey, JSON.stringify(comments));
            document.getElementById('comment-text').value = '';
            renderComments();
        });

        renderComments();
    }

    loadMarkdown();
})();
</script>
</body>
</html>
