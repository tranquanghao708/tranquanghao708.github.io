<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
  'use strict';

  const CONFIG = {
    owner: 'tranquanghao708',
    repo: 'tranquanghao708.github.io',
    branch: 'main',
    fetchTimeoutMs: 20000,
    viewDwellMs: 60 * 1000,
    viewCooldownMs: 60 * 60 * 1000,
    goatCounterEndpoint: ''
  };

  const GISCUS = {
    repo: 'tranquanghao708/tranquanghao708.github.io',
    repoId: 'R_kgDOVeKpJQ',
    category: 'General',
    categoryId: 'DIC_kwDOVeKpJc4DKFfs'
  };

  const ALLOWED_MD_HOSTS = new Set(['raw.githubusercontent.com', 'gist.githubusercontent.com']);
  const SAFE_FILE_RE = /^[a-zA-Z0-9][a-zA-Z0-9._-]{0,120}\.md$/;
  const ALERT_TYPES = new Set(['note', 'tip', 'important', 'warning', 'caution']);
  const LANG_MAP = {
    c:'c', h:'c', cpp:'cpp', 'c++':'cpp',
    asm:'x86asm', assembly:'x86asm', nasm:'x86asm', gas:'x86asm', x86:'x86asm', x86asm:'x86asm',
    sh:'bash', shell:'bash', bash:'bash', py:'python', python:'python',
    js:'javascript', javascript:'javascript', rs:'rust', go:'go', json:'json', yaml:'yaml', yml:'yaml'
  };

  const ALERT_ICONS = {
    note:'<svg viewBox="0 0 16 16"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>',
    tip:'<svg viewBox="0 0 16 16"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.10.10.0.2.192.168.1.4.36.67.576 1.022.24.393.425.747.425 1.171v1a.75.75 0 0 0 1.5 0v-1c0-.616-.262-1.14-.524-1.57a5.65 5.65 0 0 0-.597-1.048 8.861 8.861 0 0 0-.46-.558l-.214-.253C5.924 6.125 5.5 5.734 5.5 5.25 5.5 3.81 6.637 2.999 8 3c1.363 0 2.5.81 2.5 2.25 0 .484-.424.875-.984 1.496l-.214.253c-.145.172-.29.365-.46.558a5.65 5.65 0 0 0-.597 1.048c-.262.43-.524.954-.524 1.57v1a.75.75 0 0 0 1.5 0v-1c0-.424.185-.778.425-1.171a8.15 8.15 0 0 1 .576-1.022c.16-.246.32-.49.46-.732.145-.242.29-.485.46-.732l.214-.253C11.576 6.125 12 5.734 12 5.25c0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"/></svg>',
    important:'<svg viewBox="0 0 16 16"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .172.16.0.3.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>',
    warning:'<svg viewBox="0 0 16 16"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>',
    caution:'<svg viewBox="0 0 16 16"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>'
  };
  const ALERT_TITLES = { note:'Note', tip:'Tip', important:'Important', warning:'Warning', caution:'Caution' };

  /* ===== BẮT BUỘC: parse query + DOM (đoạn này bị thiếu → không load được file) ===== */
  const params = new URLSearchParams(location.search);
  const fileRaw = params.get('file');
  const urlRaw = params.get('url');
  let file = null;
  let url = null;
  if (fileRaw && SAFE_FILE_RE.test(fileRaw)) file = fileRaw;
  if (urlRaw) {
    try {
      const u = new URL(urlRaw);
      if (u.protocol === 'https:' && ALLOWED_MD_HOSTS.has(u.hostname)) url = u.toString();
    } catch (e) {}
  }
  const POST_ID = file || url || 'unknown';

  const statusEl = document.getElementById('status');
  const articleEl = document.getElementById('article');
  const contentEl = document.getElementById('content');
  const progressEl = document.getElementById('read-progress');
  const sub = document.getElementById('status-sub');
  if (sub) sub.textContent = file ? file : (url ? 'nguồn ngoài' : '');

  function githubSlug(text) {
    return String(text).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g,'d').replace(/[^a-z0-9\s._-]/g,'').replace(/[\s._]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function normalizeMarkdownHref(value) {
    const raw = String(value || '').trim();
    if (!raw || /[\u0000-\u001f\u007f]/.test(raw)) return null;
    if (raw.startsWith('#')) return raw;
    if (/^(mailto|tel):/i.test(raw)) return raw;

    let resolved;
    try {
      if (/^https?:\/\//i.test(raw)) {
        resolved = new URL(raw);
      } else if (url) {
        resolved = new URL(raw, url);
      } else if (file) {
        const source = new URL('posts/' + encodeURIComponent(file), location.origin + location.pathname);
        resolved = new URL(raw, source);
        const postsBase = new URL('posts/', location.origin + location.pathname);
        if (resolved.origin === location.origin &&
            resolved.pathname.toLowerCase().endsWith('.md') &&
            resolved.pathname.startsWith(postsBase.pathname)) {
          const targetFile = decodeURIComponent(resolved.pathname.slice(postsBase.pathname.length));
          if (!SAFE_FILE_RE.test(targetFile)) return null;
          const viewer = new URL(location.pathname, location.origin);
          viewer.searchParams.set('file', targetFile);
          viewer.hash = resolved.hash;
          return viewer.href;
        }
      } else {
        resolved = new URL(raw, location.href);
      }
    } catch {
      return null;
    }

    if (resolved.protocol !== 'https:' && resolved.protocol !== 'http:') return null;
    return resolved.href;
  }

  function sanitizeHtml(dirty) {
    if (typeof DOMPurify === 'undefined') {
      throw new Error('DOMPurify chưa tải được; dừng render để tránh chèn HTML không an toàn.');
    }
    return DOMPurify.sanitize(String(dirty), {
      USE_PROFILES: { html: true },
      ADD_TAGS: ['details','summary','kbd','img'],
      ADD_ATTR: ['open','aria-hidden','target','rel','class','id','src','alt','loading','width','height','data-slug'],
      FORBID_TAGS: ['style','iframe','object','embed','form','base','meta','link'],
      FORBID_ATTR: ['style','srcset','formaction'],
      ALLOW_DATA_ATTR: false,
      RETURN_TRUSTED_TYPE: false
    });
  }
  function parseFrontmatter(md) {
    const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
    if (!m) return { meta:{}, body:md };
    const meta = {};
    m[1].split(/\r?\n/).forEach(line => {
      const kv = line.match(/^(\w+)\s*:\s*(.*)$/);
      if (!kv) return;
      let val = kv[2].trim();
      if (val.startsWith('[') && val.endsWith(']')) {
        val = val.slice(1,-1).split(',').map(s => s.trim().replace(/^["']|["']$/g,'')).filter(Boolean);
      } else val = val.replace(/^["']|["']$/g,'');
      meta[kv[1].toLowerCase()] = val;
    });
    return { meta, body:m[2] };
  }
  function preprocessAlerts(md) {
    return md.replace(/^> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*\n((?:^>.*\n?)*)/gmi, (match, type, body) => {
      type = String(type).toLowerCase();
      if (!ALERT_TYPES.has(type)) return match;
      const cleaned = body.replace(/^>[ \t]?/gm, '').trimEnd();
      const bodyHtml = sanitizeHtml(marked.parse(cleaned, { async:false }));
      return `\n\n<div class="markdown-alert markdown-alert-${type}"><p class="markdown-alert-title">${ALERT_ICONS[type]||''} ${ALERT_TITLES[type]}</p>${bodyHtml}</div>\n\n`;
    });
  }
  function resolveLang(lang) {
    if (!lang) return '';
    const key = String(lang).trim().toLowerCase();
    return LANG_MAP[key] || key;
  }

  const headingIds = new Map();
  const renderer = new marked.Renderer();
  renderer.heading = function ({ text, depth }) {
    const plain = String(text).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    const base = githubSlug(plain) || 'section';
    const count = (headingIds.get(base) || 0) + 1;
    headingIds.set(base, count);
    const id = count === 1 ? base : `${base}-${count}`;
    const d = Math.min(6, Math.max(1, depth|0));
    return `<h${d} id="${id}" data-slug="${id}">${text}</h${d}>\n`;
  };
  renderer.link = function ({ href, title, text }) {
    const normalized = normalizeMarkdownHref(href);
    if (!normalized) return String(text || '');
    const t = title ? ` title="${escapeHtml(title)}"` : '';
    let external = false;
    try {
      const parsed = new URL(normalized, location.href);
      external = parsed.origin !== location.origin;
    } catch (e) {}
    return `<a href="${escapeHtml(normalized)}"${t}${external ? ' target="_blank" rel="noopener noreferrer nofollow"' : ''}>${text}</a>`;
  };
  renderer.image = function ({ href, title, text }) {
    const raw = String(href || '').trim();
    const src = /^data:image\/(png|gif|jpeg|webp);base64,/i.test(raw) ? raw : normalizeMarkdownHref(raw);
    if (!src) return '';
    const alt = escapeHtml(text || '');
    const t = title ? ` title="${escapeHtml(title)}"` : '';
    return `<img src="${escapeHtml(src)}" alt="${alt}" loading="lazy" decoding="async"${t}>`;
  };
  /* ===== BẮT BUỘC: code block (đoạn này cũng bị thiếu) ===== */
  renderer.code = function ({ text, lang }) {
    const resolved = resolveLang(lang);
    let highlighted = text;
    try {
      if (resolved && hljs.getLanguage(resolved)) highlighted = hljs.highlight(text, { language: resolved }).value;
      else highlighted = hljs.highlightAuto(text).value;
    } catch (e) {
      highlighted = escapeHtml(text);
    }
    const label = (lang || resolved || 'code').toLowerCase();
    return `<div class="code-wrap" data-lang="${escapeHtml(label)}"><span class="code-lang">${escapeHtml(label)}</span><button type="button" class="btn-code-copy">Copy</button><pre><code class="hljs${resolved ? ' language-' + resolved : ''}">${highlighted}</code></pre></div>\n`;
  };
  marked.setOptions({ renderer, gfm: true, breaks: false, async: false });

  function showError(msg) {
    statusEl.className = 'status error';
    statusEl.innerHTML = '<div>Lỗi: ' + escapeHtml(msg) + '</div>';
  }
  async function fetchText(resourceUrl, options) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.fetchTimeoutMs);
    try {
      return await fetch(resourceUrl, { ...options, signal: ctrl.signal, cache: 'no-store', credentials: 'omit' });
    } finally { clearTimeout(timer); }
  }
  function getPostUrl(hash) {
    const u = new URL(location.href);
    u.search = '';
    if (file) u.searchParams.set('file', file);
    else if (url) u.searchParams.set('url', url);
    u.hash = hash || '';
    return u.toString();
  }
  function updateReadProgress() {
    if (!articleEl || articleEl.style.display === 'none') { progressEl.style.width = '0%'; return; }
    const doc = document.documentElement;
    const height = Math.max(doc.scrollHeight - window.innerHeight, 1);
    const pct = Math.min(100, Math.max(0, (window.pageYOffset / height) * 100));
    progressEl.style.width = pct.toFixed(2) + '%';
  }
  window.addEventListener('scroll', updateReadProgress, { passive: true });
  window.addEventListener('resize', updateReadProgress, { passive: true });

  function decodeHashRaw() {
    let raw = (location.hash || '').replace(/^#/, '');
    if (!raw) return '';
    try { raw = decodeURIComponent(raw); } catch (e) {}
    return raw.trim();
  }
  function findHeadingByHash(raw) {
    if (!raw || !contentEl) return null;
    let el = document.getElementById(raw);
    if (el) return el;
    const slug = githubSlug(raw);
    el = document.getElementById(slug);
    if (el) return el;
    try {
      el = contentEl.querySelector('[data-slug="' + CSS.escape(slug) + '"]');
      if (el) return el;
    } catch (e) {}
    for (const h of contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
      if (githubSlug((h.textContent || '').replace(/\s+/g, ' ').trim()) === slug) return h;
    }
    return null;
  }
  function flashHeading(el) {
    if (!el) return;
    el.classList.add('heading-flash');
    clearTimeout(el._flashTimer);
    el._flashTimer = setTimeout(() => el.classList.remove('heading-flash'), 1600);
  }
  function scrollToHash(opts) {
    const behavior = (opts && opts.behavior) || 'smooth';
    const raw = decodeHashRaw();
    if (!raw) return false;
    const target = findHeadingByHash(raw);
    if (!target) return false;
    if (target.id && location.hash.replace(/^#/, '') !== target.id) history.replaceState(null, '', '#' + target.id);
    const top = target.getBoundingClientRect().top + window.pageYOffset - 72;
    window.scrollTo({ top: Math.max(0, top), behavior });
    flashHeading(target);
    const sectionInput = document.getElementById('section-link');
    if (sectionInput) sectionInput.value = getPostUrl('#' + target.id);
    return true;
  }
  function ensureScrollToHash() {
    let tries = 0;
    const tick = () => {
      tries++;
      const ok = scrollToHash({ behavior: tries <= 2 ? 'auto' : 'smooth' });
      if (!ok && tries < 12) setTimeout(tick, 80 + tries * 40);
    };
    tick();
  }
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(String(text));
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = String(text);
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let copied = false;
    try { copied = document.execCommand('copy'); }
    finally { ta.remove(); }
    if (!copied) throw new Error('Trình duyệt từ chối thao tác copy.');
  }
  function flashBtn(btn, label) {
    if (!btn) return;
    const prev = btn.textContent;
    btn.textContent = 'Đã copy!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = label || prev; btn.classList.remove('copied'); }, 1500);
  }
  function enhanceCodeBlocks() {
    contentEl.querySelectorAll('.code-wrap .btn-code-copy').forEach(btn => {
      btn.addEventListener('click', function () {
        const code = this.closest('.code-wrap')?.querySelector('code');
        if (!code) return;
        copyText(code.textContent || '').then(
          () => flashBtn(this, 'Copy'),
          error => { console.error('[copy]', error); this.textContent = 'Copy lỗi'; }
        );
      });
    });
  }
  function enhanceHeadings() {
    contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
      const plain = (h.textContent || '').replace(/\s+/g, ' ').trim();
      if (!plain) return;
      const slug = githubSlug(plain);
      if (!h.id) h.id = slug;
      h.setAttribute('data-slug', githubSlug(h.id) || slug);
      if (h.querySelector('.heading-anchor')) return;
      const a = document.createElement('a');
      a.className = 'heading-anchor'; a.href = '#' + h.id; a.textContent = '#'; a.title = 'Copy link mục';
      a.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const full = getPostUrl('#' + h.id);
        history.replaceState(null, '', '#' + h.id);
        const sectionInput = document.getElementById('section-link');
        if (sectionInput) sectionInput.value = full;
        copyText(full).then(() => flashBtn(document.getElementById('btn-copy-section'), 'Copy link mục'));
        scrollToHash({ behavior: 'smooth' });
      });
      h.prepend(a);
    });
    contentEl.addEventListener('click', function (e) {
      const a = e.target.closest('a[href^="#"]');
      if (!a || !contentEl.contains(a)) return;
      const href = a.getAttribute('href') || '';
      if (href.length < 2) return;
      e.preventDefault();
      history.pushState(null, '', href);
      requestAnimationFrame(() => {
        if (!scrollToHash({ behavior: 'smooth' })) {
          const t = findHeadingByHash(href.slice(1));
          if (t) { history.replaceState(null, '', '#' + t.id); scrollToHash({ behavior: 'smooth' }); }
        }
      });
    });
  }
  function setupShareTools() {
    const postInput = document.getElementById('post-link');
    const sectionInput = document.getElementById('section-link');
    if (!postInput.value) postInput.value = getPostUrl('');

    document.getElementById('btn-copy-post').addEventListener('click', function () {
      const value = postInput.value.trim();
      if (!value) return alert('Nhập link bài viết trước.');
      copyText(value).then(
        () => flashBtn(this, 'Copy link bài'),
        error => { console.error('[copy]', error); this.textContent = 'Copy lỗi'; }
      );
    });

    document.getElementById('btn-copy-section').addEventListener('click', function () {
      const value = sectionInput.value.trim();
      if (!value) return alert('Nhập link mục hoặc hover heading và bấm # để tự tạo link.');
      copyText(value).then(
        () => flashBtn(this, 'Copy link mục'),
        error => { console.error('[copy]', error); this.textContent = 'Copy lỗi'; }
      );
    });
  }

  function renderMath() {
    if (typeof renderMathInElement !== 'function') return;
    try {
      renderMathInElement(contentEl, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      });
    } catch (e) {}
  }
  function renderTags(meta) {
    const box = document.getElementById('post-tags');
    let tags = meta.tags || meta.tag || [];
    if (typeof tags === 'string') tags = tags.split(/[, ]+/).filter(Boolean);
    if (!Array.isArray(tags) || !tags.length) { box.style.display = 'none'; return; }
    box.innerHTML = tags.map(t => '<span class="post-tag">' + escapeHtml(t) + '</span>').join('');
    box.style.display = 'flex';
  }

  function initViews() {
    const viewKey = 'local_reads_' + POST_ID;
    const lastKey = 'local_readmeta_' + POST_ID;
    const counter = document.getElementById('view-count');

    function readCount() {
      try {
        const value = Number.parseInt(localStorage.getItem(viewKey) || '0', 10);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      } catch {
        return 0;
      }
    }
    function displayCount() {
      if (counter) counter.textContent = String(readCount());
    }
    displayCount();

    let timer = null;
    let counted = false;
    const startedAt = Date.now();

    function stop() {
      if (timer) clearTimeout(timer);
      timer = null;
    }
    function countIfEligible() {
      if (counted || document.visibilityState !== 'visible') return;
      if (Date.now() - startedAt < CONFIG.viewDwellMs) return;

      try {
        const last = Number.parseInt(localStorage.getItem(lastKey) || '0', 10);
        const now = Date.now();
        if (Number.isFinite(last) && last > 0 && now - last < CONFIG.viewCooldownMs) return;

        localStorage.setItem(viewKey, String(readCount() + 1));
        localStorage.setItem(lastKey, String(now));
        counted = true;
        displayCount();
      } catch (error) {
        console.warn('[reads] localStorage unavailable:', error);
      }
    }
    function schedule() {
      stop();
      if (document.visibilityState === 'visible' && !counted) {
        const elapsed = Date.now() - startedAt;
        timer = setTimeout(countIfEligible, Math.max(0, CONFIG.viewDwellMs - elapsed));
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') stop();
      else schedule();
    });
    window.addEventListener('pagehide', stop, { once: true });
    schedule();
  }

  function initGlobalViews() {
    const output = document.getElementById('global-view-count');
    const endpoint = String(CONFIG.goatCounterEndpoint || '').trim();
    if (!output) return;

    if (!endpoint) {
      output.textContent = 'Chưa cấu hình';
      output.title = 'Cần cấu hình GoatCounter endpoint để đếm lượt xem toàn website.';
      return;
    }

    let parsed;
    try { parsed = new URL(endpoint); } catch {
      output.textContent = 'Endpoint không hợp lệ';
      return;
    }
    if (parsed.protocol !== 'https:') {
      output.textContent = 'Endpoint không hợp lệ';
      return;
    }

    const viewPath = '/posts/' + (file || 'external');
    window.goatcounter = Object.assign({}, window.goatcounter || {}, { path: viewPath });

    const script = document.createElement('script');
    script.src = 'https://gc.zgo.at/count.js';
    script.async = true;
    script.dataset.goatcounter = endpoint;
    script.onload = () => {
      if (!window.goatcounter || typeof window.goatcounter.visit_count !== 'function') {
        output.textContent = 'Không tải được bộ đếm';
        return;
      }
      try {
        window.goatcounter.visit_count({
          append: '#global-view-count',
          path: viewPath,
          no_branding: true
        });
      } catch (error) {
        output.textContent = 'Không lấy được';
        console.warn('[views] GoatCounter:', error);
      }
    };
    script.onerror = () => { output.textContent = 'Không kết nối được'; };
    document.head.appendChild(script);
  }

  function loadGiscus() {
    const container = document.getElementById('giscus-container');
    if (!container) return;
    container.innerHTML = '';
    const term = file ? file : (url ? 'external:' + url.slice(0, 180) : 'general');
    const script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.setAttribute('data-repo', GISCUS.repo);
    script.setAttribute('data-repo-id', GISCUS.repoId);
    script.setAttribute('data-category', GISCUS.category);
    script.setAttribute('data-category-id', GISCUS.categoryId);
    script.setAttribute('data-mapping', 'specific');
    script.setAttribute('data-term', term);
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'top');
    script.setAttribute('data-theme', 'dark');
    script.setAttribute('data-lang', 'vi');
    script.setAttribute('data-loading', 'lazy');
    container.appendChild(script);
    console.info('[giscus] category =', GISCUS.category, '| term =', term);
  }

  async function loadMarkdown() {
    if (!file && !url) {
      showError('Thiếu hoặc không hợp lệ: ?file=ten.md');
      return;
    }
    let mdText = '', sourceLabel = '';
    try {
      if (url) {
        const res = await fetchText(url, { headers: { Accept: 'text/plain' }, redirect: 'follow' });
        if (!res.ok) throw new Error('Không tải được URL (HTTP ' + res.status + ')');
        const finalUrl = new URL(res.url || url);
        if (finalUrl.protocol !== 'https:' || !ALLOWED_MD_HOSTS.has(finalUrl.hostname)) {
          throw new Error('URL chuyển hướng tới host không được phép.');
        }
        mdText = await res.text();
        if (new Blob([mdText]).size > 5 * 1024 * 1024) throw new Error('Markdown vượt quá giới hạn 5 MiB.');
        sourceLabel = 'Nguồn ngoài';
      } else {
        const apiUrl = 'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo +
          '/contents/posts/' + encodeURIComponent(file) + '?ref=' + CONFIG.branch;
        let downloadUrl = 'posts/' + encodeURIComponent(file);
        let version = String(Date.now());
        try {
          const apiRes = await fetchText(apiUrl, { headers: { Accept: 'application/vnd.github.v3+json' } });
          if (apiRes.ok) {
            const info = await apiRes.json();
            if (info && info.download_url) {
              const du = new URL(info.download_url);
              if (du.hostname === 'raw.githubusercontent.com') downloadUrl = info.download_url;
            }
            if (info && info.sha) version = info.sha.slice(0, 8);
          }
        } catch (e) {}
        const sep = downloadUrl.includes('?') ? '&' : '?';
        const res = await fetchText(downloadUrl + sep + 'v=' + encodeURIComponent(version), {
          headers: { Accept: 'text/plain' }
        });
        if (!res.ok) {
          if (res.status === 404) throw new Error('Không tìm thấy posts/' + file);
          if (res.status === 403 || res.status === 429) throw new Error('GitHub đang giới hạn truy cập. Thử lại sau.');
          throw new Error('GitHub trả về HTTP ' + res.status);
        }
        mdText = await res.text();
        if (new Blob([mdText]).size > 5 * 1024 * 1024) throw new Error('Markdown vượt quá giới hạn 5 MiB.');
        sourceLabel = file + ' · v=' + version;
      }

      const { meta, body } = parseFrontmatter(mdText);
      headingIds.clear();
      contentEl.innerHTML = sanitizeHtml(marked.parse(preprocessAlerts(body)));
      contentEl.querySelectorAll('a[href^="http"]').forEach(a => {
        a.setAttribute('rel', 'noopener noreferrer nofollow');
        a.setAttribute('target', '_blank');
      });
      enhanceCodeBlocks();
      enhanceHeadings();
      renderMath();
      renderTags(meta);

      document.getElementById('post-meta').textContent = 'Nguồn: ' + sourceLabel + ' · đang học';
      statusEl.style.display = 'none';
      articleEl.style.display = 'block';
      document.getElementById('views-bar').style.display = 'flex';
      document.getElementById('share-tools').style.display = 'block';
      document.getElementById('comments-wrap').style.display = 'block';
      document.getElementById('back-link').style.display = 'inline-block';
      document.getElementById('footer').style.display = 'block';

      const h1 = contentEl.querySelector('h1');
      document.title = String(meta.title || (h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : 'Bài viết')).slice(0, 80) + ' | Trần Quang Hào';

      setupShareTools();
      ensureScrollToHash();
      updateReadProgress();
      initViews();
      initGlobalViews();
      loadGiscus();
    } catch (err) {
      showError(err && err.name === 'AbortError' ? 'Timeout' : (err && err.message ? err.message : 'Lỗi tải'));
      console.error(err);
    }
  }

  window.addEventListener('hashchange', () => scrollToHash({ behavior: 'smooth' }));
  window.addEventListener('popstate', () => scrollToHash({ behavior: 'smooth' }));
  loadMarkdown();
})();
</script>
