<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<title>Ghi chú | Trần Quang Hào</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AC%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="ll.css">
<style>
.filter{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.85rem;margin-bottom:1.2rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.5rem .8rem}
.filter span{color:var(--green);white-space:nowrap}
.filter input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;min-width:0}
.status{text-align:center;padding:2.5rem 1rem;color:var(--dim);font-family:var(--mono);font-size:.9rem}
.status.error{color:var(--red)}
.post-list{display:grid;gap:.8rem}
.post-card{display:block;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.2rem;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s,box-shadow .2s}
.post-card:hover{border-color:var(--accent);transform:translateX(3px);box-shadow:0 0 18px rgba(88,166,255,.12)}
.post-meta{font-family:var(--mono);font-size:.75rem;color:var(--dim);margin-bottom:.3rem;display:flex;gap:.9rem;flex-wrap:wrap}
.post-meta .perm{color:var(--green)}
.post-card h2{font-size:1.05rem;color:#fff;font-weight:600;line-height:1.35}
.post-card h2::before{content:"> ";color:var(--green);font-family:var(--mono)}
.post-card p{font-size:.85rem;color:var(--muted)}
.empty{border:1px dashed var(--border);border-radius:var(--r);padding:2.2rem 1.5rem;text-align:center;color:var(--dim)}
.empty code{font-family:var(--mono);color:var(--accent)}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="container">
  <div class="top-bar">
    <nav class="nav">
      <a href="index.html" class="logo"><span>~/</span>tranquanghao</a>
      <ul class="nav-links">
        <li><a href="index.html">home</a></li>
        <li><a href="notes.html" class="active">notes</a></li>
      </ul>
    </nav>
  </div>

  <h1>Ghi chú &amp; Writeup</h1>
  <p class="subtitle">$ ls -la posts/</p>
  <p class="tagline" style="margin-bottom:1.6rem">Tự động lấy từ thư mục <code style="font-family:var(--mono);color:var(--accent)">posts/</code> trong repo. Thả file <code style="font-family:var(--mono);color:var(--accent)">.md</code> vào là hiện.</p>

  <label class="filter" id="filter" hidden><span>$ grep -i</span><input id="q" type="search" placeholder="từ khoá…" autocomplete="off" spellcheck="false" aria-label="Lọc bài viết"></label>
  <div id="status" class="status" role="status">Đang đọc thư mục posts/<span class="cur"></span></div>
  <div id="post-list" class="post-list" hidden></div>

  <footer>
    <p>© 2026 tranquanghao708</p>
    <a href="https://github.com/tranquanghao708" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>
<script src="ll.js"></script>
<script>
(function () {
  'use strict';
  const CONFIG = { owner: 'tranquanghao708', repo: 'tranquanghao708.github.io', path: 'posts', branch: 'main', timeoutMs: 15000 };
  const $ = id => document.getElementById(id);
  const statusEl = $('status'), listEl = $('post-list'), filterEl = $('filter'), q = $('q');
  let posts = [];

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const toTitle = n => n.replace(/\.md$/i, '').replace(/[-_]+/g, ' ').replace(/(^|\s)\S/g, c => c.toUpperCase());
  const fmtSize = b => b < 1024 ? b + 'B' : (b / 1024).toFixed(1) + 'K';

  function render() {
    const kw = q.value.trim().toLowerCase();
    const shown = posts.filter(p => !kw || p.name.toLowerCase().includes(kw) || p.title.toLowerCase().includes(kw));
    if (!shown.length) {
      listEl.innerHTML = '<div class="empty">grep: không có kết quả cho "' + esc(q.value) + '"</div>';
      return;
    }
    listEl.innerHTML = shown.map(p =>
      '<a class="post-card" href="post.html?file=' + encodeURIComponent(p.name) + '">' +
      '<div class="post-meta"><span class="perm">-rw-r--r--</span><span>' + fmtSize(p.size) + '</span><span>' + esc(p.name) + '</span></div>' +
      '<h2>' + esc(p.title) + '</h2></a>').join('');
  }

  async function load() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.timeoutMs);
    try {
      const res = await fetch('https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/' + CONFIG.path + '?ref=' + CONFIG.branch,
        { cache: 'no-store', signal: ctrl.signal, headers: { Accept: 'application/vnd.github+json' } });
      if (res.status === 404) throw new Error('Không tìm thấy thư mục "' + CONFIG.path + '/" hoặc sai tên repo.');
      if (res.status === 403 || res.status === 429) throw new Error('GitHub API bị giới hạn (rate limit). Thử lại sau vài phút.');
      if (!res.ok) throw new Error('Lỗi API: ' + res.status);
      const files = await res.json();
      posts = (Array.isArray(files) ? files : [])
        .filter(f => f.type === 'file' && /^[a-zA-Z0-9][a-zA-Z0-9._-]{0,120}\.md$/.test(f.name))
        .map(f => ({ name: f.name, size: f.size || 0, title: toTitle(f.name) }))
        .sort((a, b) => b.name.localeCompare(a.name));

      if (!posts.length) {
        statusEl.className = '';
        statusEl.innerHTML = '<div class="empty">total 0<br>Tạo thư mục <code>posts/</code>, thêm file <code>.md</code> rồi push lên.</div>';
        return;
      }
      statusEl.hidden = true;
      filterEl.hidden = false;
      listEl.hidden = false;
      render();
      q.addEventListener('input', render);
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Lỗi: ' + (err.name === 'AbortError' ? 'hết thời gian chờ.' : err.message);
      console.error(err);
    } finally { clearTimeout(timer); }
  }
  load();
})();
</script>
</body>
</html>
