<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi chú | Trần Quang Hào</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
    <style>
        :root {
            --bg: #0d1117;
            --bg-elevated: #161b22;
            --bg-card: #1c2128;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --text-dim: #6e7681;
            --accent: #58a6ff;
            --font-mono: "SFMono-Regular", "Cascadia Code", "Fira Code", Consolas, Menlo, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            --radius: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88,166,255,0.07), transparent);
        }
        .container { max-width: 820px; margin: 0 auto; padding: 0 1.25rem 4rem; }

        .top-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(13,17,23,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            margin: 0 -1.25rem 2.5rem;
            padding: 0 1.25rem;
        }
        .nav {
            display: flex; align-items: center; justify-content: space-between;
            height: 56px; max-width: 820px; margin: 0 auto;
        }
        .logo {
            font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600;
            color: var(--text); text-decoration: none;
        }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 1.4rem; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        h1 { font-size: 1.6rem; color: #fff; margin-bottom: 0.35rem; }
        .page-desc { color: var(--text-muted); margin-bottom: 1.8rem; font-size: 0.98rem; }
        .page-desc code {
            font-family: var(--font-mono); background: #0d1117;
            padding: 0.15em 0.4em; border-radius: 4px; color: var(--accent); font-size: 0.9em;
        }

        .status {
            text-align: center; padding: 3rem 1rem;
            color: var(--text-dim); font-family: var(--font-mono); font-size: 0.95rem;
        }
        .status.error { color: #f85149; }

        .post-list { display: grid; gap: 1rem; }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem 1.35rem;
            text-decoration: none; color: inherit;
            display: block;
            transition: border-color 0.2s, transform 0.2s;
        }
        .post-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .post-meta {
            font-family: var(--font-mono); font-size: 0.8rem;
            color: var(--text-dim); margin-bottom: 0.4rem;
            display: flex; gap: 0.9rem; flex-wrap: wrap;
        }
        .post-card h2 {
            font-size: 1.08rem; color: #fff; margin-bottom: 0.3rem;
            font-weight: 600; line-height: 1.35;
        }
        .post-card p {
            font-size: 0.9rem; color: var(--text-muted); margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty {
            background: var(--bg-elevated);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 2.8rem 1.5rem;
            text-align: center; color: var(--text-dim);
        }
        .empty code {
            font-family: var(--font-mono); background: #0d1117;
            padding: 0.15em 0.4em; border-radius: 4px; color: var(--accent);
        }

        footer {
            margin-top: 3.5rem; padding-top: 1.8rem;
            border-top: 1px solid var(--border);
            display: flex; flex-wrap: wrap; justify-content: space-between;
            font-size: 0.84rem; color: var(--text-dim); gap: 1rem;
        }
        footer a { color: var(--text-muted); text-decoration: none; }
        footer a:hover { color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <nav class="nav">
            <a href="index.html" class="logo"><span>~/</span>tranquanghao</a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="notes.html" class="active">Ghi chú</a></li>
            </ul>
        </nav>
    </div>

    <h1>Ghi chú & Writeup</h1>
    <p class="page-desc">
        Tự động lấy từ thư mục <code>posts/</code> trong repo. 
        Chỉ cần thả file <code>.md</code> vào là hiện, không cần sửa HTML.
    </p>

    <div id="status" class="status">Đang tải danh sách bài viết…</div>
    <div id="post-list" class="post-list" style="display:none"></div>

    <footer>
        <p>© 2026 tranquanghao708</p>
        <a href="https://github.com/tranquanghao708" target="_blank" rel="noopener">GitHub</a>
    </footer>
</div>

<script>
(function () {
    // =====================================================
    // CẤU HÌNH – SỬA ĐÚNG REPO CỦA BẠN
    // =====================================================
    const CONFIG = {
        owner: 'tranquanghao708',                 // username GitHub
        repo: 'tranquanghao708.github.io',        // ← tên repo chứa index.html + posts/
        path: 'posts',                            // thư mục chứa file .md
        branch: 'main'                            // hoặc 'master'
    };
    // Nếu repo của bạn tên khác (ví dụ "blog", "notes"...), sửa dòng repo ở trên.

    const statusEl = document.getElementById('status');
    const listEl   = document.getElementById('post-list');

    function filenameToTitle(name) {
        return name
            .replace(/\.md$/i, '')
            .replace(/[-_]/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase());
    }

    async function loadPosts() {
        const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}?ref=${CONFIG.branch}`;

        try {
            const res = await fetch(apiUrl, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });

            if (res.status === 404) {
                throw new Error(`Không tìm thấy thư mục "${CONFIG.path}/" hoặc sai tên repo. Kiểm tra lại CONFIG.`);
            }
            if (res.status === 403) {
                throw new Error('GitHub API bị rate limit. Thử lại sau vài phút.');
            }
            if (!res.ok) {
                throw new Error(`Lỗi API GitHub: ${res.status}`);
            }

            const files = await res.json();

            const mdFiles = (Array.isArray(files) ? files : [])
                .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.md'))
                .sort((a, b) => b.name.localeCompare(a.name));

            if (mdFiles.length === 0) {
                statusEl.innerHTML = `
                    <div class="empty">
                        <p style="margin-bottom:0.9rem">Chưa có bài viết nào.</p>
                        <p>Tạo thư mục <code>posts/</code> trong repo, rồi thêm file <code>.md</code> vào đó và push lên.</p>
                    </div>`;
                return;
            }

            // Tạo danh sách – link đúng sang post.html?file=...
            listEl.innerHTML = mdFiles.map(file => {
                const title = filenameToTitle(file.name);
                const size = (file.size / 1024).toFixed(1);
                return `
                    <a href="post.html?file=${encodeURIComponent(file.name)}" class="post-card">
                        <div class="post-meta">
                            <span>${file.name}</span>
                            <span>${size} KB</span>
                        </div>
                        <h2>${title}</h2>
                        <p>Nhấn để đọc bài viết được render từ Markdown.</p>
                    </a>
                `;
            }).join('');

            statusEl.style.display = 'none';
            listEl.style.display = 'grid';

        } catch (err) {
            statusEl.className = 'status error';
            statusEl.textContent = 'Lỗi: ' + err.message;
            console.error(err);
        }
    }

    loadPosts();
})();
</script>
</body>
</html>
